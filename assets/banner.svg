<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Awesome Promotion Management - curated list of promotion, loyalty, coupon and voucher platforms">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%">
        <animate attributeName="stop-color" values="#6d28d9;#2563eb;#7c3aed;#db2777;#6d28d9" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%">
        <animate attributeName="stop-color" values="#2563eb;#7c3aed;#db2777;#6d28d9;#2563eb" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color" values="#4f46e5;#db2777;#2563eb;#7c3aed;#4f46e5" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shine" x1="-50%" y1="0%" x2="150%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6,0;1.6,0;-0.6,0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="r" values="40%;60%;40%" dur="5s" repeatCount="indefinite"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Animated gradient background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Floating decorative circles -->
  <g filter="url(#soft)">
    <circle cx="120" cy="60" r="34" fill="#ffffff" opacity="0.10">
      <animate attributeName="cy" values="60;40;60" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="230" r="46" fill="#ffffff" opacity="0.10">
      <animate attributeName="cy" values="230;250;230" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="240" r="22" fill="#ffffff" opacity="0.14">
      <animate attributeName="cx" values="60;80;60" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="70" r="18" fill="#ffffff" opacity="0.14">
      <animate attributeName="cy" values="70;55;70" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Shine sweep -->
  <rect width="1200" height="300" fill="url(#shine)"/>

  <!-- Glow behind title -->
  <circle cx="600" cy="150" r="180" fill="url(#glow)"/>

  <!-- Floating emojis -->
  <text x="120" y="180" font-size="44" text-anchor="middle">🎁
    <animate attributeName="y" values="180;160;180" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="1070" y="120" font-size="40" text-anchor="middle">⭐
    <animate attributeName="y" values="120;100;120" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="1000" y="220" font-size="36" text-anchor="middle">🏷️
    <animate attributeName="y" values="220;240;220" dur="4.5s" repeatCount="indefinite"/>
  </text>
  <text x="190" y="120" font-size="36" text-anchor="middle">🎟️
    <animate attributeName="y" values="120;140;120" dur="5.5s" repeatCount="indefinite"/>
  </text>

  <!-- Title -->
  <text x="600" y="135" font-family="Verdana, Arial, sans-serif" font-size="58" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <tspan>Awesome-Promotion-Management</tspan>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="600" y="185" font-family="Verdana, Arial, sans-serif" font-size="26" fill="#e9d5ff" text-anchor="middle">
    <tspan>Promotions · Loyalty · Coupons · Vouchers · Incentives · Offers</tspan>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
  </text>

  <!-- Bottom pill -->
  <g>
    <rect x="430" y="215" width="340" height="40" rx="20" fill="#ffffff" opacity="0.15"/>
    <text x="600" y="242" font-family="Verdana, Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <tspan>✨ Open Source First ✨</tspan>
    </text>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="3s" repeatCount="indefinite"/>
  </g>
</svg>
